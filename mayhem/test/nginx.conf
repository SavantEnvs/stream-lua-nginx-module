daemon off;
master_process off;
worker_processes 1;
error_log @TMP@/error.log info;
pid @TMP@/nginx.pid;

events { worker_connections 64; }

stream {
    lua_package_path "@CORE@/lib/?.lua;@LRU@/lib/?.lua;;";
    lua_shared_dict dogs 1m;

    init_by_lua_block {
        local function hex(s)
            return (s:gsub(".", function(c) return string.format("%02x", c:byte()) end))
        end

        handlers = {
            b64enc = function(arg) return ngx.encode_base64(arg) end,
            b64dec = function(arg) return ngx.decode_base64(arg) end,
            unesc = function(arg) return ngx.unescape_uri(arg) end,
            esc = function(arg) return ngx.escape_uri("a b&c/d") end,
            match = function(arg)
                local m = ngx.re.match("abc 123-xyz", [[(\d+)-(\w+)]], "jo")
                return m[0] .. "|" .. m[1] .. "|" .. m[2]
            end,
            gsub = function(arg)
                local s, n = ngx.re.gsub("hello world", "(o)", "[$1]")
                return s .. " " .. n
            end,
            md5 = function(arg) return ngx.md5(arg) end,
            sha1 = function(arg) return hex(ngx.sha1_bin(arg)) end,
            crc32 = function(arg) return tostring(ngx.crc32_short(arg)) end,
            shdict = function(arg)
                local d = ngx.shared.dogs
                d:set("k", arg)
                d:set("n", 41)
                local n = d:incr("n", 1)
                return d:get("k") .. "|" .. n
            end,
            lexer = function(arg)
                local s = "}{" -- } {
                return s .. [==[ ]] }]==]
            end,
        }
    }

    server {
        listen 127.0.0.1:@PORT@;

        content_by_lua_block {
            local sock = assert(ngx.req.socket())
            local line = sock:receive("*l")
            local cmd, arg = line:match("^(%S+) ?(.*)$")

            if cmd == "recv" then
                local it = sock:receiveuntil("--")
                local a = it()
                local b = it()
                ngx.say(a, "|", b)
                return
            end

            ngx.say(handlers[cmd](arg))
        }
    }
}
